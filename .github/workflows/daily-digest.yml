name: X Daily Digest

on:
  schedule:
    # Three off-hour UTC fires per day. The {7,8}-hour ET gate in
    # time_utils.should_run plus the Slack-history idempotency check ensure
    # exactly one digest posts no matter how many slots fire:
    #   EDT (Mar-Nov): 11:17 = 07:17 ET (in window), 12:17 = 08:17 ET (idempotent skip), 13:17 = 09:17 ET (gate skip).
    #   EST (Nov-Mar): 11:17 = 06:17 ET (gate skip), 12:17 = 07:17 ET (in window), 13:17 = 08:17 ET (idempotent skip).
    # The :17 offset dodges the top-of-hour cron rush where GH Actions
    # silently drops scheduled fires under load.
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the hour gate (idempotency still applies — use for off-hour testing)"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Run digest
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m x_digest --force
          else
            python -m x_digest
          fi

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-url: ${{ secrets.SLACK_FAILURE_WEBHOOK }}
          payload: |
            {
              "text": "X Daily Digest failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
