name: X Daily Digest

on:
  schedule:
    # Four off-hour UTC fires per day. The 7am-11am ET delivery window in
    # time_utils.should_run + the Slack-history idempotency check together
    # ensure exactly one digest posts per day even when GH Actions silently
    # delays fires by 1-4 hours (observed: routine multi-hour delays in 2026).
    # First on-time fire posts; later fires (delayed or on-time) skip via
    # idempotency. The :17 offset dodges the top-of-hour cron rush.
    - cron: "17 11 * * *"
    - cron: "17 12 * * *"
    - cron: "17 13 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Skip the hour gate (idempotency still applies — use for off-hour testing)"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: pip install -e .

      - name: Run digest
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m x_digest --force
          else
            python -m x_digest
          fi

      - name: Notify on failure
        if: failure()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          webhook-url: ${{ secrets.SLACK_FAILURE_WEBHOOK }}
          payload: |
            {
              "text": "X Daily Digest failed — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
